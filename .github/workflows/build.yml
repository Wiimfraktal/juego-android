name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publicar en Releases (tag latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk abismo-de-cristal.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest abismo-de-cristal.apk \
            --target "$GITHUB_SHA" \
            --title "Abismo de Cristal (última versión)" \
            --notes "APK listo para instalar. Commit: $GITHUB_SHA"
